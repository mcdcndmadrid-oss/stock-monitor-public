name: Stock Monitor

# Corre en el repo PÚBLICO — consume minutos gratuitos ilimitados.
# Lee y escribe datos en el repo PRIVADO mediante PRIVATE_DATA_REPO_PAT.
#
# Variable de repo necesaria (Settings → Variables → Repository variables):
#   DATA_REPO = tu_usuario/stock-monitor-data
#
# Secrets necesarios (Settings → Secrets → Actions):
#   PRIVATE_DATA_REPO_PAT     — fine-grained PAT con Contents R/W sobre DATA_REPO
#   ANTHROPIC_API_KEY
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   TWELVE_DATA_API_KEY
#   MARKETAUX_API_KEY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public code
        uses: actions/checkout@v4

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.PRIVATE_DATA_REPO_PAT }}
          path: private-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load private data
        run: |
          cp private-data/portfolio.json       . 2>/dev/null || echo "WARN: portfolio.json no encontrado"
          cp private-data/portfolio_state.json . 2>/dev/null || echo "WARN: portfolio_state.json no encontrado"
          cp private-data/alerts_log.json      . 2>/dev/null || echo "WARN: alerts_log.json no encontrado"
          cp private-data/swing_history.json   . 2>/dev/null || echo "WARN: swing_history.json no encontrado"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKETAUX_API_KEY:    ${{ secrets.MARKETAUX_API_KEY }}
        run: python monitor.py

      - name: Save outputs to private data repo
        run: |
          cp portfolio_state.json private-data/ 2>/dev/null || true
          cp alerts_log.json      private-data/ 2>/dev/null || true
          cp swing_history.json   private-data/ 2>/dev/null || true

      - name: Commit to private data repo
        working-directory: private-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state.json alerts_log.json swing_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update portfolio state"
            git pull --rebase origin main
            git push
          fi
